name: Android CI/CD

on:
  push:
    branches: [ "main" ] # Déclenche la génération lors d'un push sur la branche main
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout le code source
      uses: actions/checkout@v4

    - name: Configurer JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Rendre le script Gradle exécutable
      run: chmod +x ./gradlew

    - name: Compiler l'APK (Assemble Release)
      run: ./gradlew assembleRelease # Utilisez assembleDebug si vous n'avez pas encore configuré vos clés de signature

    - name: Téléverser l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: MonApplication-APK
        path: app/build/outputs/apk/release/app-release.apk # Ajustez le chemin selon votre configuration (ex: .../debug/app-debug.apk)
